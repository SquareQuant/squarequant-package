name: Financial risk statistics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check squarequant tests examples/risk_metrics_demo.py
      - run: python -m ruff format --check squarequant tests examples/risk_metrics_demo.py
      - run: python -m mypy --no-incremental
      - run: python -m sphinx -W -b html docs docs/_build/html
      - run: python -m build
      - run: python examples/risk_metrics_demo.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import squarequant as sq; assert len(sq.__all__) == 21; print(sq.__version__)"
        working-directory: ${{ runner.temp }}
